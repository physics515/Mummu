[package]
name = "mummu-bench"
description = "Criterion benchmarks for Mummu: TTFT, decode tok/s, VRAM per model x device-set."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The GPU feature set is forwarded rather than inherited so the budget gates
# can be run BOTH ways from one tree (`--no-default-features --features
# vulkan-spirv` against the default). The default set below is exactly
# mummu's own default, so every existing invocation builds unchanged.
[features]
default = ["fusion", "vulkan-spirv"]
fusion = ["mummu/fusion"]
vulkan-spirv = ["mummu/vulkan-spirv"]

[dependencies]
mummu = { path = "../mummu", default-features = false }
burn = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tokenizers = { workspace = true }
# The budget gates read logits back through `decode::argmax_id`, which is a
# future under burn 0.22 - the gates are `#[tokio::test]`, the same idiom as
# the library's own unit tests.
tokio = { workspace = true }

[[bench]]
name = "runner"
harness = false
