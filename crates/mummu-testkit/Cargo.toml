[package]
name = "mummu-testkit"
description = "Shared fixtures for mummu's integration tests: the llama.cpp reference harness, the GGUF parity verdict, and the recorded qwen4exp reference."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A library, so every fixture item is reachable from every test binary that
# links it: the three modules used to be `#[path]`-shared files under
# `crates/mummu/tests/`, where each binary saw the half it did not call as
# dead code. mummu lists this crate as a dev-dependency (the cycle is the
# standard one cargo permits for test support).
[dependencies]
mummu = { path = "../mummu", default-features = false }
mummu-num = { workspace = true }
burn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
ureq = { workspace = true }
