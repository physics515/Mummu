<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mummu</title>
<style>
  :root {
    --bg: #101014; --panel: #17171d; --panel2: #1e1e26; --border: #2a2a35;
    --text: #e7e7ee; --dim: #8a8a99; --accent: #7aa2f7; --user: #24283b;
    --err: #f7768e; --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 600; letter-spacing: .04em; }
  header h1 span { color: var(--accent); }
  select, input[type=number], button, textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font: inherit;
  }
  select { max-width: 300px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .badge {
    font-size: 12px; color: var(--dim); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; white-space: nowrap;
  }
  .badge.gpu { color: var(--ok); }
  #pullwrap { display: flex; align-items: center; gap: 8px; }
  #pullbar { width: 140px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; display: none; }
  #pullbar div { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  #log { flex: 1; overflow-y: auto; padding: 18px 0 8px; }
  .msg { max-width: 760px; margin: 0 auto 14px; padding: 0 16px; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 3px; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { background: var(--user); border-radius: 10px; padding: 8px 12px; }
  .msg.assistant .body { padding: 2px 0; }
  .msg .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
  /* Live load progress while a generation is in flight — a cold load spends
     minutes before the first token, and an empty bubble reads as "broken". */
  .msg .status { margin-top: 6px; }
  .msg .status:empty { display: none; }

  /* The bar and the two gauges. Shared, character for character, with
     logs.html: both pages are include_str!'d into the binary with no build
     step, so the duplication is deliberate — see the comment at the top of
     logs.html. Keep them in step by hand. */
  .prog { max-width: 520px; font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .prog .plabel { color: var(--dim); white-space: pre-wrap; word-break: break-word; }
  .track {
    height: 6px; background: var(--panel2); border-radius: 3px;
    overflow: hidden; margin-top: 4px;
  }
  .track > i {
    display: block; height: 100%; width: 0; background: var(--accent);
    border-radius: 3px; transition: width .35s linear;
  }
  /* A phase with no count (packing, warming) sweeps instead of lying about a
     percentage. `transform`, not `width`, so it costs no layout. */
  .track.indet > i { width: 32%; transition: none; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(350%); } }
  .gauges { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
  .gauge { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .gauge .gname { letter-spacing: .04em; }
  .gauge .gtrack { width: 84px; height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .gauge .gtrack > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s linear; }
  /* No reading at all: the track is visibly inert, never a full-looking 0%. */
  .gauge .gtrack.na { opacity: .3; }
  .gauge .gmine { opacity: .75; }
  a.nav {
    color: var(--dim); text-decoration: none; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  a.nav:hover { color: var(--accent); border-color: var(--accent); }
  .msg .body details {
    color: var(--dim); font-size: 13px; border-left: 2px solid var(--border);
    padding-left: 10px; margin: 4px 0; white-space: pre-wrap;
  }
  .msg .body details summary { cursor: pointer; user-select: none; }
  .err { color: var(--err); }
  footer { padding: 10px 16px 14px; background: var(--panel); border-top: 1px solid var(--border); }
  .inputrow { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 42px; max-height: 180px; }
  .opts { max-width: 760px; margin: 8px auto 0; display: flex; gap: 14px; font-size: 12px; color: var(--dim); align-items: center; flex-wrap: wrap; }
  .opts label { display: flex; gap: 5px; align-items: center; }
  .opts input { width: 70px; padding: 2px 6px; font-size: 12px; }
  #empty { text-align: center; color: var(--dim); margin-top: 12vh; }
  #empty .big { font-size: 40px; }
</style>
</head>
<body>
<header>
  <h1><span>mummu</span> serve</h1>
  <select id="model" title="model"></select>
  <span id="pullwrap">
    <button id="pull" style="display:none">Pull</button>
    <span id="pullbar"><div></div></span>
    <span id="pullpct" class="badge" style="display:none"></span>
  </span>
  <span style="flex:1"></span>
  <a class="nav" href="/logs" title="Everything this server printed, plus every API and shim request, merged">Logs</a>
  <button id="unload" title="Drop the resident model from GPU/CPU memory">Unload</button>
  <button id="clear" title="Clear the conversation">Clear</button>
  <span id="device" class="badge">…</span>
  <!-- Which build is actually running. "Is the new release deployed?" was
       asked and could not be answered from the server at all. -->
  <span id="build" class="badge" title="running version (git commit)"></span>
</header>

<div id="log"><div id="empty"><div class="big">𒀯</div>Pick a model, pull it if needed, and say something.</div></div>

<footer>
  <div class="inputrow">
    <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="opts">
    <label>temp <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7"></label>
    <label>top_p <input id="topp" type="number" min="0.05" max="1" step="0.05" value="0.9"></label>
    <label>max tokens <input id="maxtok" type="number" min="1" max="4096" step="1" value="512"></label>
    <label><input id="system" type="text" placeholder="system prompt (optional)" style="width:280px"></label>
  </div>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log"), modelSel = $("model"), pullBtn = $("pull");
let models = [], history = [], generating = false;

function fmtBytes(b) {
  if (!b) return "?";
  const u = ["B","KB","MB","GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + " " + u[i];
}

async function refresh() {
  const [h, m] = await Promise.all([
    fetch("/api/health").then(r => r.json()),
    fetch("/api/models").then(r => r.json()),
  ]);
  const dev = $("device");
  dev.textContent = h.device;
  dev.classList.toggle("gpu", h.device.includes("GPU"));
  dev.title = (h.gpus || []).map(g => `${g.name} (${g.api})`).join("\n") || "no GPU adapters";
  // textContent, not innerHTML: these come off the wire like everything else.
  $("build").textContent = h.version ? `v${h.version} (${h.build || "unknown"})` : "";
  models = m.models;
  const prev = modelSel.value;
  modelSel.innerHTML = "";
  for (const mod of models) {
    const o = document.createElement("option");
    o.value = mod.name;
    o.textContent = `${mod.installed ? "●" : "○"} ${mod.name} (${mod.format}, ~${fmtBytes(mod.disk_bytes_estimate)})`;
    modelSel.appendChild(o);
  }
  const installed = models.find(x => x.installed);
  modelSel.value = prev && models.some(x => x.name === prev) ? prev : (installed ? installed.name : (models[0] || {}).name || "");
  syncPull();
}

function current() { return models.find(x => x.name === modelSel.value); }
function syncPull() {
  const c = current();
  pullBtn.style.display = c && !c.installed ? "" : "none";
}
modelSel.addEventListener("change", syncPull);

function addMsg(who, text) {
  $("empty") && $("empty").remove();
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.innerHTML = `<div class="who">${who}</div><div class="body"></div><div class="status"></div><div class="meta"></div>`;
  renderBody(div.querySelector(".body"), text);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// Render text with <think>…</think> blocks folded into <details>.
//
// Streaming re-renders this body on EVERY delta, and a rebuilt <details>
// defaults to closed — which collapsed the thinking fold under the reader
// dozens of times per reply. So the open flags are carried across renders by
// position: whatever the user (or the streaming default) set, survives. A
// fold first seen mid-stream (no </think> yet) starts open so the thinking
// is visible while it happens; one first seen complete starts closed.
function renderBody(el, text) {
  const prevOpen = [...el.querySelectorAll("details")].map(d => d.open);
  el.textContent = "";
  const re = /<think>([\s\S]*?)(<\/think>|$)/g;
  let last = 0, m, fold = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const d = document.createElement("details");
    d.open = fold < prevOpen.length ? prevOpen[fold] : m[2] === "";
    fold++;
    const s = document.createElement("summary");
    s.textContent = "thinking…";
    d.appendChild(s);
    d.appendChild(document.createTextNode(m[1]));
    el.appendChild(d);
    last = re.lastIndex;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

async function readSse(resp, onEvent) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of frame.split("\n")) {
        if (line.startsWith("data: ")) onEvent(JSON.parse(line.slice(6)));
      }
    }
  }
}

// ---------------------------------------------------------------------------
// The load bar and the two memory gauges.
//
// The failure this fixes: a cold 27B load spends over two minutes reading its
// pack off a spinning array before the first token, and this UI showed an
// empty assistant bubble the whole time — indistinguishable from a hung
// server. What the operator asked for, in their words, was "a loading progress
// bar" and "showing loading to memory and vram".
//
// The numbers come from the `status` object on /api/logs, NOT from parsing the
// log lines. The loader prints its progress once every 15 seconds — right for
// `docker logs`, hopeless for a bar, which would sit still for a quarter of a
// minute and then jump. The status object is fed by atomics the loader updates
// once per tensor (see crates/mummu/src/progress.rs).
//
// It rides the poll this page was already making, so it costs nothing new.
// ---------------------------------------------------------------------------

const GIB = 1024 ** 3;
const MIB = 1024 ** 2;

// GiB with a sensible number of digits: "14.5 GiB", "124 GiB".
function gib(bytes) {
  const g = bytes / GIB;
  return (g >= 100 ? g.toFixed(0) : g.toFixed(1)) + " GiB";
}

// Seconds as something a person reads off a bar.
function secs(s) {
  if (s < 60) return Math.round(s) + " s";
  const m = Math.floor(s / 60);
  return m + " min " + String(Math.round(s - m * 60)).padStart(2, "0") + " s";
}

// A width in percent, clamped to its own track — the one place either bar
// works out how wide to be.
//
// Clamping is not defensive decoration. `done` and `expected` reach the server
// as separate relaxed atomic stores (see mummu::progress), so a snapshot may
// legitimately catch them mid-`begin` and carry a count past its own total. A
// gauge reading 103% simply draws past the end of its track; the load bar did
// exactly that, and the label beside it printed the raw counts.
const widthPct = (used, total) => Math.max(0, Math.min(100, (used / total) * 100)).toFixed(1) + "%";

// Build the bar + gauges. Returns { root, render }. Everything is written with
// textContent and style widths — never innerHTML — because a model name the
// client chose reaches the label.
function makeProgress() {
  const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const root = el("div", "prog");
  const label = el("div", "plabel");
  const track = el("div", "track");
  const fill = el("i");
  track.appendChild(fill);
  const gauges = el("div", "gauges");
  const gauge = name => {
    const g = el("div", "gauge");
    const n = el("span", "gname"); n.textContent = name;
    const t = el("span", "gtrack");
    const f = el("i");
    t.appendChild(f);
    const v = el("span", "gval");
    g.append(n, t, v);
    gauges.appendChild(g);
    return { track: t, fill: f, value: v };
  };
  const ram = gauge("RAM"), vram = gauge("VRAM");
  root.append(label, track, gauges);

  // One gauge: `used` of `total`, plus an optional "mine" note naming this
  // process's share. A null reading renders "n/a" with an inert track, never
  // an empty one that reads as 0%.
  const setGauge = (g, used, total, mine) => {
    if (total == null || total <= 0) {
      g.track.classList.add("na");
      g.fill.style.width = "0%";
      g.value.textContent = "n/a";
      return;
    }
    g.track.classList.remove("na");
    g.fill.style.width = widthPct(used, total);
    g.value.textContent = `${(used / GIB).toFixed(1)} / ${gib(total)}`;
    if (mine != null) g.value.textContent += ` · mummu ${(mine / GIB).toFixed(1)}`;
  };

  // Returns true while a load is actually in flight, so the caller can decide
  // whether the bar belongs under the bubble at all. (On /logs the same render
  // keeps it up and reads "ready"; here it comes and goes with the wait.)
  const render = st => {
    if (!st) return false;
    setGauge(ram, st.host ? st.host.total - st.host.available : null,
             st.host ? st.host.total : null, st.host ? st.host.rss : null);
    setGauge(vram, st.vram ? st.vram.used : null, st.vram ? st.vram.total : null, null);

    // The SERVER decides whether a phase is work (`Phase::is_working`). This
    // used to be a list of phase names held here, and a phase added on the
    // server then drew no bar at all — which is exactly what would have
    // happened to `importing` and `partitioning`, the two phases that cover
    // the longest part of a first-ever load.
    if (!st.working) return false;
    const determinate = st.total > 0;
    // "step 2" is not decoration. The tiered and partitioned paths load in two
    // counted passes, and the second one legitimately restarts at 0 with a
    // different denominator and a fresh eta; without the step a bar that
    // resets mid-load reads as a hang to the person watching it. Shown only
    // beside a count, because the count is the thing that restarted.
    const phase = determinate && st.step > 1 ? `${st.phase} (step ${st.step})` : st.phase;
    const parts = [st.model ? `${phase} ${st.model}` : phase];
    // Clamped for the same reason the width is: a torn snapshot must read
    // "851/851 tensors", never "900/851". The UNIT comes from the server: the
    // three loaders count tensors, layers and experts, and this said "tensors"
    // for all three.
    if (determinate) parts.push(`${Math.min(st.done, st.total)}/${st.total} ${st.unit || "tensors"}`);
    if (st.bytes > 0) {
      // MiB/s labelled "MB/s", matching the server's own load line exactly —
      // the two sit next to each other on /logs and must not disagree.
      const rate = st.rate_bps == null ? "" : ` at ${(st.rate_bps / MIB).toFixed(0)} MB/s`;
      parts.push(gib(st.bytes) + rate);
    }
    // No eta is rendered as no eta. The server sends null when it cannot know
    // one (no total, nothing done yet, no measurable time) and the page does
    // not get to invent a number the server refused to guess.
    if (st.eta_s != null) parts.push(`about ${secs(st.eta_s)} left`);
    else if (st.elapsed_s != null) parts.push(`${secs(st.elapsed_s)} so far`);
    label.textContent = parts.join(" — ");
    track.className = determinate ? "track" : "track indet";
    fill.style.width = determinate ? widthPct(st.done, st.total) : "";
    return true;
  };
  return { root, render };
}

// Poll the load status while a generation is in flight, into `el`.
function watchLoadProgress(el) {
  let stopped = false, misses = 0;
  const bar = makeProgress();
  const tick = async () => {
    if (stopped) return;
    try {
      // limit=1: this wants the `status` object, not the lines — /logs is
      // where the whole merged feed lives.
      const page = await fetch("/api/logs?limit=1&source=server", { cache: "no-store" })
        .then(r => r.json());
      // Re-check AFTER the await. A poll still in flight when the generation
      // ends would otherwise draw a stale bar under a finished answer, with
      // nothing left running to ever clear it. (Found in review of the line
      // this replaces; the same window exists here.)
      if (stopped) return;
      if (bar.render(page.status)) {
        if (!bar.root.isConnected) el.appendChild(bar.root);
        log.scrollTop = log.scrollHeight;
      } else if (bar.root.isConnected) {
        bar.root.remove();
      }
      misses = 0;
    } catch (e) {
      misses++;   // a poll that fails is not worth reporting; the chat stream is
    }
    // Never faster than once a second, and back off if the server stops
    // answering — this runs alongside a generation and must cost nothing.
    if (!stopped) setTimeout(tick, misses ? Math.min(1000 * 2 ** misses, 10000) : 1000);
  };
  tick();
  return () => { stopped = true; el.textContent = ""; };
}

pullBtn.addEventListener("click", async () => {
  const c = current();
  if (!c) return;
  pullBtn.disabled = true;
  $("pullbar").style.display = "inline-block";
  $("pullpct").style.display = "";
  try {
    const resp = await fetch("/api/pull", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: c.name }),
    });
    await readSse(resp, ev => {
      if (ev.type === "progress") {
        const pct = ev.percent == null ? null : ev.percent;
        $("pullbar").firstElementChild.style.width = (pct ?? 0) + "%";
        $("pullpct").textContent = pct != null ? pct + "%" : fmtBytes(ev.received_bytes);
      } else if (ev.type === "error") {
        alert("pull failed: " + ev.error);
      }
    });
  } finally {
    pullBtn.disabled = false;
    $("pullbar").style.display = "none";
    $("pullpct").style.display = "none";
    refresh();
  }
});

$("unload").addEventListener("click", () => fetch("/api/unload", { method: "POST" }));
$("clear").addEventListener("click", () => {
  history = [];
  log.innerHTML = '<div id="empty"><div class="big">𒀯</div>Pick a model, pull it if needed, and say something.</div>';
});

async function send() {
  const text = $("input").value.trim();
  const c = current();
  if (!text || generating || !c) return;
  if (!c.installed) { alert("Pull this model first."); return; }
  generating = true; $("send").disabled = true;
  $("input").value = ""; autosize();
  addMsg("user", text);
  history.push({ role: "user", content: text });

  const messages = [];
  const sys = $("system").value.trim();
  if (sys) messages.push({ role: "system", content: sys });
  messages.push(...history);

  const div = addMsg("assistant", "");
  const body = div.querySelector(".body");
  const stopStatus = watchLoadProgress(div.querySelector(".status"));
  let acc = "";
  const request = {
    model: c.name,
    messages,
    options: {
      temperature: parseFloat($("temp").value),
      top_p: parseFloat($("topp").value),
      max_tokens: parseInt($("maxtok").value, 10),
    },
  };
  // Same frames either way; only the transport differs.
  const onEvent = ev => {
    if (ev.type === "delta") {
      stopStatus();   // the answer is arriving; the load status has done its job
      acc += ev.text;
      renderBody(body, acc);
      log.scrollTop = log.scrollHeight;
    } else if (ev.type === "done") {
      renderBody(body, ev.text || acc);
      div.querySelector(".meta").textContent =
        `${ev.tokens} tokens · ${ev.tokens_per_second} tok/s · ${ev.device}`;
      history.push({ role: "assistant", content: ev.text || acc });
    } else if (ev.type === "error") {
      throw new Error(ev.error || `request rejected (${ev.status})`);
    }
  };
  try {
    await chatOverSocket(request, onEvent);
  } catch (e) {
    body.innerHTML += `<div class="err">⚠ ${e.message}</div>`;
    // keep history consistent: a failed turn contributes no assistant message
    if (history[history.length - 1]?.role !== "assistant") { /* nothing to pop */ }
  } finally {
    stopStatus();
    generating = false; $("send").disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

// Chat over a WebSocket rather than POST + SSE.
//
// Not a preference — a proxy limit. Behind Cloudflare an HTTP response that
// sends no bytes for 100 s is cut with a 524, and a cold request here sends
// none for MINUTES while a 27B model is read from disk and placed across
// devices. Cloudflare does not apply that timeout to WebSockets, and the
// server pings through the load so the connection is never idle either.
//
// Falls back to POST + SSE if the socket cannot be opened at all, so a proxy
// or browser without WebSocket support still works — it just inherits the
// timeout this is here to avoid.
function chatOverSocket(request, onEvent) {
  return new Promise((resolve, reject) => {
    // Only a failure BEFORE the stream opens is worth falling back on; once
    // frames are flowing, a drop is a real error and retrying would replay
    // the whole generation.
    let opened = false;
    // ONE fallback, ever: a socket the proxy refuses fires BOTH error and
    // close with `opened` still false, and two `chatOverSse` calls run the
    // whole generation twice — the duplicate parks on the model slot and
    // burns a full decode after the visible one finishes.
    let fellBack = false;
    const fallBack = () => {
      if (opened || fellBack) return;
      fellBack = true;
      chatOverSse(request, onEvent).then(resolve, reject);
    };
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let socket;
    try {
      socket = new WebSocket(`${proto}//${location.host}/api/chat/ws`);
    } catch (e) {
      fallBack();
      return;
    }
    socket.addEventListener("open", () => {
      opened = true;
      socket.send(JSON.stringify(request));
    });
    socket.addEventListener("message", ev => {
      try {
        onEvent(JSON.parse(ev.data));
      } catch (e) {
        socket.close();
        reject(e);
      }
    });
    socket.addEventListener("error", fallBack);
    socket.addEventListener("close", () => {
      if (opened) resolve();
      else fallBack();
    });
  });
}

async function chatOverSse(request, onEvent) {
  const resp = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(request),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: resp.statusText }));
    throw new Error(err.error || resp.statusText);
  }
  await readSse(resp, onEvent);
}

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
}
$("input").addEventListener("input", autosize);

refresh();
setInterval(() => { if (!generating) refresh(); }, 30000);
</script>
