[package]
name = "mummu"
description = "From-scratch Burn model runner: import any open model, quantize it to fit, run it on all the hardware you have."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
burn = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
once_cell = { workspace = true }
burn-flex = { workspace = true }
burn-store = { workspace = true }

[dev-dependencies]
# Test-only reference renderer for the imported `chat_template` Jinja: claims
# byte-identical output to `transformers.apply_chat_template`. Powers the
# template-vs-renderer BYTE gate (tests/template_gate.rs); production prompt
# wrapping stays the hardcoded, byte-verified `chat` renderers.
# Default features stay ON: they carry minijinja's Python-compat layer
# (str.startswith etc.), which real HF templates (Qwen3's included) call.
hf-chat-template = "0.2.1"

[target.'cfg(windows)'.dependencies]
# One syscall (GlobalMemoryStatusEx) for the device inventory's total-RAM
# figure; the narrow feature keeps the compile cost near zero. (The DXGI
# VRAM walk binds its own frozen COM ABI in backend.rs — windows-sys 0.60+
# dropped COM interface bindings entirely.)
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
