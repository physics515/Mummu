[package]
name = "mummu"
description = "From-scratch Burn model runner: import any open model, quantize it to fit, run it on all the hardware you have."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `fusion` + `vulkan-spirv` are the parity-validated GPU configuration and
# stay in the default set — every existing consumer, test, and bench builds
# exactly as before the 2026-08-21 feature split. They exist as features so
# mummu-serve's WSL2 container can opt out: mesa's dzn (Vulkan-on-D3D12)
# driver panics burn-fusion's stream executor and its SPIR-V→DXIL path is
# unproven, while plain WGSL-compiled Wgpu works.
default = ["fusion", "vulkan-spirv"]
# Compile streams of tensor ops into fewer GPU kernels (burn's `fusion`;
# `Wgpu` transparently becomes `Fusion<Wgpu>`).
fusion = [
	"burn/fusion",
	"burn-cubecl/fusion",
	"dep:burn-fusion",
	"dep:burn-ir",
	"dep:derive-new",
]
# CubeCL compiles kernels as direct SPIR-V on Vulkan adapters instead of
# WGSL/naga (decode 70.7 -> 54.3 ms/token, bench/BASELINE.md).
vulkan-spirv = ["burn/vulkan"]
# The CUDA backend (`backend::Cuda`), OFF by default: wgpu is the
# parity-validated stack and needs no CUDA toolchain. This exists for
# environments where no correct Vulkan reaches the process but libcuda does —
# concretely mummu-serve's WSL2 container (Docker Desktop injects libcuda;
# mesa's dzn Vulkan-on-D3D12 driver computes WRONG results there, 2026-08-21).
# Consumers opting in take on kernel compilation via NVRTC at runtime.
cuda = ["burn/cuda"]
# Render a checkpoint's OWN imported `chat_template` Jinja (crate::template),
# for models whose family has no hardcoded `chat` renderer. Off by default:
# the from-scratch renderers cover the zoo byte-for-byte and a default build
# should not carry a Jinja engine to wrap a prompt. Turning it on pulls
# hf-chat-template (minijinja) — the same crate, same version, that the
# template BYTE gate already trusts as the transformers-equivalent reference.
jinja-template = ["dep:hf-chat-template"]
# Render `prof`'s folded stacks to flame-graph SVGs (pulls inferno, the pure
# -Rust port of the flamegraph tools). The profiler itself needs no feature —
# only the SVG rendering does.
flamegraph = ["dep:inferno"]

[dependencies]
inferno = { version = "0.11", optional = true, default-features = false }
# The async runtime: mummu's model runtime is async (burn 0.22 readbacks,
# cancellable decode loops), so the library owns a tokio dependency rather
# than leaving async to consumers.
tokio = { workspace = true }
burn = { workspace = true }
burn-cubecl = { workspace = true }
cubecl = { workspace = true }
burn-fusion = { workspace = true, optional = true }
burn-ir = { workspace = true, optional = true }
derive-new = { workspace = true, optional = true }
mummu-mix = { workspace = true }
mummu-schedule = { workspace = true }
hf-chat-template = { workspace = true, optional = true }
wgpu = { workspace = true }
pollster = { workspace = true }
half = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
once_cell = { workspace = true }
burn-flex = { workspace = true }
rayon = { workspace = true }
burn-store = { workspace = true }
cubecl-runtime = { workspace = true }

[dev-dependencies]
# Test-only reference renderer for the imported `chat_template` Jinja: claims
# byte-identical output to `transformers.apply_chat_template`. Powers the
# template-vs-renderer BYTE gate (tests/template_gate.rs); production prompt
# wrapping stays the hardcoded, byte-verified `chat` renderers.
# Default features stay ON: they carry minijinja's Python-compat layer
# (str.startswith etc.), which real HF templates (Qwen3's included) call.
# Also the dependency behind the optional `jinja-template` feature above;
# listing it here too keeps the gate running in a plain `cargo test`.
hf-chat-template = { workspace = true }

[target.'cfg(windows)'.dependencies]
# One syscall (GlobalMemoryStatusEx) for the device inventory's total-RAM
# figure; the narrow feature keeps the compile cost near zero. (The DXGI
# VRAM walk binds its own frozen COM ABI in backend.rs — windows-sys 0.60+
# dropped COM interface bindings entirely.)
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
