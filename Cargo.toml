[workspace]
resolver = "3"
members = [
	"crates/mummu",
	"crates/mummu-app",
	"crates/mummu-mix",
	"crates/mummu-schedule",
	"crates/mummu-bench",
	"crates/mummu-serve",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physics515/Mummu"

[workspace.dependencies]
# Intentional pins (see ROADMAP "Stack"): burn 0.21 + wgpu 29 are the parity-validated
# combination proven in laurelane (byte-identical logits vs Candle). wgpu is not ours to
# pick — burn 0.21 resolves 29 transitively, so wgpu 30 unblocks with a burn bump, not a
# `cargo upgrade`. tokenizers rides 0.23 as of 2026-07-16: every parity number came back
# bit-identical to 0.22, so it is no longer part of the pinned combination.
# `fusion` + `autotune` are the throughput levers: fusion compiles streams of tensor ops
# into far fewer GPU kernels and autotune picks the fastest kernel variant; with `fusion`,
# `Wgpu` transparently becomes `Fusion<Wgpu>`.
burn = { version = "0.22.0-pre.2", default-features = false, features = [
	"std",
	"wgpu",
	# burn 0.22 selects backends at runtime through `Device`, so the flex
	# integration must be on for `Device::flex()` to exist (0.21 reached the
	# CPU backend through the `burn_flex::Flex` type instead).
	"flex",
	"autotune",
	"store",
	# The sanctioned custom-op seam (`burn::backend::backend_extension` and
	# the dispatch/primitive escape hatches) — carried by crates already in
	# the graph, pulls nothing new. Added for the packed m=1 Q4 GEMV.
	"extension",
] }
# Kernel authoring for the packed Q4 GEMV: burn-cubecl for CubeTensor /
# quantized_handles / empty_device, cubecl for the #[cube] macro. Exact `=`
# pins: pre-release caret semantics would accept a -pre.3 that the burn
# crates' own `=` pins then refuse to unify with.
burn-cubecl = { version = "=0.22.0-pre.2", default-features = false }
cubecl = { version = "=0.11.0-pre.2", default-features = false, features = ["wgpu"] }
# The fusion wrapper for the same op (Fusion<B> re-enters the stream via
# CustomOpIr) — only compiled under mummu's `fusion` feature.
burn-fusion = { version = "=0.22.0-pre.2", default-features = false }
burn-ir = { version = "=0.22.0-pre.2", default-features = false }
derive-new = { version = "0.7", default-features = false }
rayon = "1" 
# `vulkan` switches CubeCL's kernel compiler on Vulkan adapters from
# WGSL/naga to direct SPIR-V; other APIs keep WGSL in the same binary.
# Adopted 2026-07-12: decode 70.7 -> 54.3 ms/token with parity
# byte-identical (see bench/BASELINE.md).
# `vulkan` and `fusion` moved OUT of this list on 2026-08-21: they are now
# forwarded through mummu's `vulkan-spirv` / `fusion` features (both in
# mummu's default set, so every existing build is unchanged) because
# mummu-serve's WSL2 container needs to opt out — mesa's dzn driver
# (Vulkan-on-D3D12) breaks under them (burn-fusion stream-ordering panics).
# The CPU backend: pure-Rust SIMD + gemm, burn-ndarray's designated successor
# (0.21 release notes); swapped in 2026-07-10 after the MiniLM Candle-parity
# gate passed on it bit-for-bit-equivalent (cosine 0.99999994, max component
# diff 1.3e-7) with all 80 unit tests green.
burn-flex = "0.22.0-pre.2"
# The two schedulers, as their own crates: A divides work across devices,
# B decides the precision of the weights on each. Both are dependency-free —
# see their crate docs — which is why they are separate rather than modules.
mummu-mix = { path = "crates/mummu-mix" }
mummu-schedule = { path = "crates/mummu-schedule" }
# Direct handle on burn-store (the same crate burn's `store` feature pulls) to
# turn on its `pytorch` feature: .pth / pytorch_model.bin state-dict loading
# for models never re-shipped as safetensors (feature-unified, no duplicate).
burn-store = { version = "0.22.0-pre.2", default-features = false, features = [
	"std",
	"safetensors",
	"pytorch",
] }

# Direct handle on cubecl-runtime (the same version burn 0.21 resolves through
# burn-cubecl) to read the autotune-cache location out of the very config
# CubeCL itself discovers — `crate::tune` reports and clears it. Feature-
# unified, so this adds no compile time; hardcoding the discovery rule instead
# would drift from cubecl's the first time it changes.
cubecl-runtime = "0.11.0-pre.2"

# Direct handle on wgpu (the same version Burn resolves) for the cheap startup
# adapter probe: enumerate GPUs to decide GPU vs CPU before building a backend.
wgpu = "30"
# Block on wgpu 29's async adapter enumeration from the sync startup probe.
pollster = "1.0"
# f16 element type for the GPU backend; the same `half` version Burn pulls.
half = "2"
# `esaxx_fast` (a default feature) is off deliberately: it builds esaxx-rs's
# C++ suffix-array with `.static_crt(true)` hardcoded in its build.rs, so the
# object demands the static CRT (/DEFAULTLIB:LIBCMT) while rustc-msvc links the
# dynamic one -> LNK4098. It only accelerates the Unigram *trainer*, which we
# never run (tokenizers falls back to `esaxx_rs::suffix_rs`, pure Rust), so
# dropping it costs nothing and needs no upstream fix (Narsil/esaxx-rs#11 is
# open; its PR #19 is unmerged). `onig` is load-bearing (SysRegex) and stays.
tokenizers = { version = "0.23", default-features = false, features = [
	"onig",
	"progressbar",
] }

# Blocking HTTP (rustls) for the P3 model downloader; small, sync like the rest
# of the library surface.
ureq = "3"
# Stream-verifies downloads against the Hub's announced LFS sha256
# (X-Linked-ETag); SHA-NI accelerated, ~GB/s — negligible next to the network.
sha2 = "0.11"

serde = { version = "1", features = ["derive"] }
# The async runtime. mummu is async end to end (not just the server): burn
# 0.22 exposes real async readbacks (`into_data_async`), so a decode that
# waits on the device yields its worker instead of parking it, and a
# disconnected client's generation can actually be cancelled at an await
# point. Multi-threaded flavor — the model runtime is CPU-bound work that
# must spread across cores.
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"fs",
	"io-util",
	"net",
	"signal",
] }
# Async HTTP for mummu-serve, replacing tiny_http's thread-per-request model.
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
# `preserve_order` (insertion-order maps) is deliberate and load-bearing for
# prompt bytes: Python/transformers renders tool JSON in dict insertion order,
# so our tool-bearing prompts only byte-match the reference stack's rendering
# with it on. It is also what the hf-chat-template dev-dependency (the
# template byte gate) requires — without it here, test builds would unify the
# feature on while production consumer builds leave it off, and the two would
# render DIFFERENT prompt bytes (found 2026-07-23 when the gate landed).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
once_cell = "1"

criterion = "0.8"

# Renders an HF `chat_template` Jinja byte-identically to
# `transformers.apply_chat_template` (minijinja + a transformers compat
# layer). Two roles, one version: the test-only reference behind the template
# BYTE gate, and — behind mummu's non-default `jinja-template` feature — the
# fallback renderer for checkpoints with no hardcoded family renderer.
hf-chat-template = "1.0.0"

[profile.release]
# Thin LTO: inference is GPU-kernel-bound, so fat LTO's extra minutes per link
# buy almost nothing here while tripling the verify-loop cost. Revisit against
# bench/BASELINE.md numbers if a CPU-bound path ever becomes hot.
lto = "thin"

# Optimize DEPENDENCIES ONLY in dev/test; our own crates stay -O0 and fully
# debuggable. Unoptimized burn/CubeCL blow the stack of their own worker
# thread when a real model runs (STATUS_STACK_OVERFLOW on `DSD-*`): -O0 keeps
# every inlinable frame of a deep generic tensor call chain live at once.
# This is why the real-weights GPU suites could only be run `--release`.
[profile.dev.package."*"]
opt-level = 2
