[workspace]
resolver = "3"
members = ["crates/mummu", "crates/mummu-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/physics515/Mummu"

[workspace.dependencies]
# Intentional pins (see ROADMAP "Stack"): burn 0.21 + wgpu 29 are the parity-validated
# combination proven in laurelane (byte-identical logits vs Candle). wgpu is not ours to
# pick — burn 0.21 resolves 29 transitively, so wgpu 30 unblocks with a burn bump, not a
# `cargo upgrade`. tokenizers rides 0.23 as of 2026-07-16: every parity number came back
# bit-identical to 0.22, so it is no longer part of the pinned combination.
# `fusion` + `autotune` are the throughput levers: fusion compiles streams of tensor ops
# into far fewer GPU kernels and autotune picks the fastest kernel variant; with `fusion`,
# `Wgpu` transparently becomes `Fusion<Wgpu>`.
burn = { version = "0.21", default-features = false, features = [
	"std",
	"wgpu",
	# `vulkan` switches CubeCL's kernel compiler on Vulkan adapters from
	# WGSL/naga to direct SPIR-V; other APIs keep WGSL in the same binary.
	# Adopted 2026-07-12: decode 70.7 -> 54.3 ms/token with parity
	# byte-identical (see bench/BASELINE.md).
	"vulkan",
	"fusion",
	"autotune",
	"store",
] }
# The CPU backend: pure-Rust SIMD + gemm, burn-ndarray's designated successor
# (0.21 release notes); swapped in 2026-07-10 after the MiniLM Candle-parity
# gate passed on it bit-for-bit-equivalent (cosine 0.99999994, max component
# diff 1.3e-7) with all 80 unit tests green.
burn-flex = "0.21"
# Direct handle on burn-store (the same crate burn's `store` feature pulls) to
# turn on its `pytorch` feature: .pth / pytorch_model.bin state-dict loading
# for models never re-shipped as safetensors (feature-unified, no duplicate).
burn-store = { version = "0.21", default-features = false, features = [
	"std",
	"safetensors",
	"pytorch",
] }

# Direct handle on wgpu (the same version Burn resolves) for the cheap startup
# adapter probe: enumerate GPUs to decide GPU vs CPU before building a backend.
wgpu = "29"
# Block on wgpu 29's async adapter enumeration from the sync startup probe.
pollster = "1.0"
# f16 element type for the GPU backend; the same `half` version Burn pulls.
half = "2"
# `esaxx_fast` (a default feature) is off deliberately: it builds esaxx-rs's
# C++ suffix-array with `.static_crt(true)` hardcoded in its build.rs, so the
# object demands the static CRT (/DEFAULTLIB:LIBCMT) while rustc-msvc links the
# dynamic one -> LNK4098. It only accelerates the Unigram *trainer*, which we
# never run (tokenizers falls back to `esaxx_rs::suffix_rs`, pure Rust), so
# dropping it costs nothing and needs no upstream fix (Narsil/esaxx-rs#11 is
# open; its PR #19 is unmerged). `onig` is load-bearing (SysRegex) and stays.
tokenizers = { version = "0.23", default-features = false, features = [
	"onig",
	"progressbar",
] }

# Blocking HTTP (rustls) for the P3 model downloader; small, sync like the rest
# of the library surface.
ureq = "3"
# Stream-verifies downloads against the Hub's announced LFS sha256
# (X-Linked-ETag); SHA-NI accelerated, ~GB/s — negligible next to the network.
sha2 = "0.11"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
once_cell = "1"

criterion = "0.8"

[profile.release]
# Thin LTO: inference is GPU-kernel-bound, so fat LTO's extra minutes per link
# buy almost nothing here while tripling the verify-loop cost. Revisit against
# bench/BASELINE.md numbers if a CPU-bound path ever becomes hot.
lto = "thin"

# Optimize DEPENDENCIES ONLY in dev/test; our own crates stay -O0 and fully
# debuggable. Unoptimized burn/CubeCL blow the stack of their own worker
# thread when a real model runs (STATUS_STACK_OVERFLOW on `DSD-*`): -O0 keeps
# every inlinable frame of a deep generic tensor call chain live at once.
# This is why the real-weights GPU suites could only be run `--release`.
[profile.dev.package."*"]
opt-level = 2
